<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOX COACH · SafeZone Esports</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #050810; --surface: #0a0f1e; --card: #0d1525; --card2: #101b30; --border: #1a2540;
    --accent: #00d4ff; --accent2: #2f7bff; --gold: #f0b430; --red: #ff4655; --green: #00e5a0;
    --text: #e8eaf0; --muted: #6a7a9a;
  }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; min-height: 100vh;
    background-image: radial-gradient(ellipse at 15% 10%, #0a1f4a33 0%, transparent 55%),
      radial-gradient(ellipse at 85% 90%, #001a3333 0%, transparent 55%),
      repeating-linear-gradient(0deg, transparent, transparent 40px, #ffffff04 40px, #ffffff04 41px),
      repeating-linear-gradient(90deg, transparent, transparent 40px, #ffffff04 40px, #ffffff04 41px);
    background-attachment: fixed;
  }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .pad { padding: 16px; }
  .mono { font-family: monospace; }
  h1,h2,h3,.exo { font-family: "Exo 2", sans-serif; }

  /* LAYOUT */
  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; background: #080d1bee; border-right: 1px solid var(--border); padding: 20px 14px; display: flex; flex-direction: column; gap: 6px; backdrop-filter: blur(12px); }
  .brand { padding: 4px 10px 18px; }
  .brand-name { font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 20px; letter-spacing: .06em; }
  .brand-name span { color: var(--accent); text-shadow: 0 0 14px #00d4ff66; }
  .brand-sub { font-size: 10px; color: var(--muted); letter-spacing: .25em; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 8px; color: var(--muted); cursor: pointer; font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid transparent; transition: all .2s; user-select: none; }
  .nav-item .ic { font-size: 16px; width: 20px; text-align: center; }
  .nav-item:hover { color: var(--text); background: #ffffff06; }
  .nav-item.active { color: var(--accent); background: linear-gradient(90deg, #00d4ff18, transparent); border-color: #00d4ff33; box-shadow: inset 2px 0 0 var(--accent); }
  .side-foot { margin-top: auto; padding: 10px; font-size: 11px; color: var(--muted); letter-spacing: .1em; }
  .side-foot button { background: none; border: 1px solid var(--border); color: var(--muted); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 11px; letter-spacing: .08em; margin-top: 8px; width: 100%; }
  .side-foot button:hover { color: var(--red); border-color: #ff465566; }
  .live { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 1.5s infinite alternate; }
  @keyframes pulse { from { box-shadow: 0 0 5px var(--green); } to { box-shadow: 0 0 14px var(--green); } }

  main { padding: 24px 28px 60px; min-width: 0; max-width: 1180px; width: 100%; margin: 0 auto; }
  .topbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 22px; }
  .topbar input { flex: 1; min-width: 200px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 11px 14px; color: var(--text); font-size: 14px; font-family: monospace; outline: none; transition: border-color .2s, box-shadow .2s; }
  .topbar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #00d4ff14; }
  select { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 11px 12px; color: var(--text); font-size: 13px; outline: none; font-family: inherit; }
  .btn { background: var(--accent); color: #050810; border: none; border-radius: 8px; padding: 11px 24px; font-size: 13px; font-weight: 800; letter-spacing: .1em; cursor: pointer; font-family: "Exo 2", sans-serif; box-shadow: 0 0 16px #00d4ff44; transition: all .2s; }
  .btn:hover { background: #33deff; transform: translateY(-1px); }
  .btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; box-shadow: none; transform: none; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid #00d4ff55; box-shadow: none; padding: 8px 16px; }
  .btn.ghost:hover { background: #00d4ff14; }
  .btn.sm { padding: 7px 14px; font-size: 11px; }
  .error-box { width: 100%; padding: 10px 14px; background: #ff465515; border: 1px solid #ff465544; border-radius: 8px; color: var(--red); font-size: 13px; }
  .warn-box { width: 100%; padding: 10px 14px; background: #f0b43012; border: 1px solid #f0b43044; border-radius: 8px; color: var(--gold); font-size: 13px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 18px; animation: rise .35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .card-title { font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 13px; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .card-title b { color: var(--accent); font-weight: 800; }
  .page-title { font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 24px; margin-bottom: 4px; }
  .page-title span { color: var(--accent); }
  .page-sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; }
  .hero .card { margin-bottom: 0; }
  .hero-wrap { margin-bottom: 18px; }

  /* PROFILE */
  .player { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .player img { width: 54px; height: 54px; border-radius: 8px; border: 1px solid var(--border); object-fit: cover; }
  .player-name { font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 20px; }
  .player-name span { color: var(--muted); font-weight: 400; }
  .player-meta { color: var(--muted); font-size: 12px; letter-spacing: .05em; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip { padding: 4px 12px; background: #00d4ff12; border: 1px solid #00d4ff3a; border-radius: 20px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .06em; }
  .chip.gold { background: #f0b43012; border-color: #f0b43044; color: var(--gold); }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; transition: border-color .2s; }
  .tile:hover { border-color: #00d4ff44; }
  .tile-l { font-size: 10px; color: var(--muted); letter-spacing: .15em; text-transform: uppercase; }
  .tile-v { font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 20px; margin-top: 2px; }
  .tile-v small { font-size: 11px; color: var(--muted); font-weight: 400; }

  /* FOX SCORE */
  .score-wrap { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .ring { position: relative; width: 140px; height: 140px; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); }
  .ring-num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-num b { font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 40px; line-height: 1; }
  .ring-num small { font-size: 10px; color: var(--muted); letter-spacing: .2em; }
  .subs { flex: 1; min-width: 200px; }
  .stat-wrap { margin-bottom: 9px; }
  .stat-label { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .stat-label span:first-child { color: var(--muted); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .stat-label span:last-child { font-size: 12px; font-family: monospace; }
  .stat-track { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .stat-fill { height: 100%; border-radius: 2px; transition: width 1s ease; }
  .trend { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: .05em; }
  .trend.up { background: #00e5a018; color: var(--green); border: 1px solid #00e5a044; }
  .trend.flat { background: #f0b43014; color: var(--gold); border: 1px solid #f0b43044; }
  .trend.down { background: #ff465518; color: var(--red); border: 1px solid #ff465544; }
  .trend.na { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { background: none; border: none; color: var(--muted); padding: 6px 14px; font-family: "Exo 2", sans-serif; font-weight: 700; font-size: 12px; cursor: pointer; letter-spacing: .05em; transition: all .2s; }
  .seg button.on { background: #00d4ff1c; color: var(--accent); }
  .foot-note { font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 12px; }

  /* CHART */
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .pt { transition: r .15s; cursor: pointer; }
  .chart .pt:hover { r: 6; }
  .chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 8px; }
  .chart-name { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .chart-val { font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 18px; }

  /* MATCHES */
  .match-item { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; cursor: pointer; transition: all .2s; }
  .match-item:hover { border-color: var(--accent); background: #0d1f3c; box-shadow: 0 0 18px #00d4ff22; transform: translateX(2px); }
  .match-bar { width: 5px; height: 44px; border-radius: 3px; flex-shrink: 0; }
  .m-main { flex: 1; min-width: 0; }
  .m-top { display: flex; justify-content: space-between; gap: 8px; }
  .m-agent { font-weight: 700; font-size: 16px; }
  .m-res { font-size: 11px; font-weight: 800; letter-spacing: .1em; }
  .m-det { display: flex; gap: 14px; margin-top: 4px; flex-wrap: wrap; font-size: 12px; }
  .m-det .map { color: var(--muted); }
  .m-det .kda { color: var(--accent); font-family: monospace; }
  .m-det .gd { color: var(--gold); }
  .m-det .dim { color: var(--muted); }
  .m-fox { text-align: center; min-width: 54px; }
  .m-fox b { font-family: "Exo 2", sans-serif; font-size: 24px; font-weight: 800; line-height: 1; display: block; }
  .m-fox small { font-size: 9px; color: var(--muted); letter-spacing: .15em; }

  /* TABLE */
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
  th { text-align: left; font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border); font-weight: 700; }
  td { padding: 11px 10px; border-bottom: 1px solid #1a254066; }
  tr:hover td { background: #00d4ff08; }
  td.name { font-weight: 700; }
  .tag { display: inline-block; font-size: 9px; font-weight: 800; letter-spacing: .12em; padding: 2px 8px; border-radius: 10px; margin-left: 8px; vertical-align: middle; }
  .tag.best { background: #00e5a018; color: var(--green); border: 1px solid #00e5a044; }
  .tag.worst { background: #ff465518; color: var(--red); border: 1px solid #ff465544; }
  .hl { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
  .hl .card { margin: 0; }
  .hl-label { font-size: 11px; letter-spacing: .2em; font-weight: 800; }
  .hl-name { font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 26px; margin: 4px 0; }
  .hl-sub { font-size: 12px; color: var(--muted); }

  /* INSIGHTS */
  .ins { display: flex; gap: 12px; padding: 11px 14px; background: var(--surface); border-radius: 8px; border-left: 3px solid var(--accent); margin-bottom: 8px; font-size: 14px; line-height: 1.45; }
  .ins.warn { border-left-color: var(--red); }
  .ins.good { border-left-color: var(--green); }
  .ins.na { border-left-color: var(--muted); color: var(--muted); }
  .ins .ico { font-size: 15px; }
  .ai-box { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
  .ai-main { background: linear-gradient(135deg, #1a3a6a44, var(--card)); border: 1px solid #00d4ff44; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; font-size: 15px; font-weight: 600; line-height: 1.45; }
  .ai-main small { display: block; color: var(--accent); letter-spacing: .18em; font-size: 10px; margin-bottom: 4px; }
  .na-list { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .na-list li { margin-left: 16px; }

  /* TRAINING */
  .train { border: 1px solid #f0b43044; border-radius: 12px; padding: 20px; margin-bottom: 16px; background: linear-gradient(135deg, #2a1a0044, var(--card)); animation: rise .35s ease both; }
  .train-p { font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 11px; letter-spacing: .22em; color: var(--gold); }
  .train-t { font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 22px; margin: 4px 0 12px; }
  .train-row { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid #f0b43022; font-size: 14px; line-height: 1.45; }
  .train-row b { font-size: 11px; letter-spacing: .15em; color: var(--muted); text-transform: uppercase; padding-top: 2px; }
  .goal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .goal-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .goal-name { font-weight: 700; font-size: 15px; }
  .goal-nums { font-size: 12px; color: var(--muted); margin: 6px 0 8px; font-family: monospace; }
  .x { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; }
  .x:hover { color: var(--red); }

  /* DRAWER (FOX REPORT) */
  .drawer { position: fixed; inset: 0; z-index: 300; display: flex; justify-content: flex-end; }
  .drawer-bg { position: absolute; inset: 0; background: #000a; backdrop-filter: blur(3px); animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .drawer-panel { position: relative; width: min(620px, 100%); height: 100%; overflow-y: auto; background: var(--bg); border-left: 1px solid var(--border); padding: 22px; animation: slidein .3s ease; box-shadow: -10px 0 40px #00d4ff10; }
  @keyframes slidein { from { transform: translateX(40px); opacity: 0 } to { transform: none; opacity: 1 } }
  .drawer-close { position: absolute; top: 14px; right: 16px; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 16px; z-index: 2; }
  .drawer-close:hover { border-color: var(--accent); color: var(--accent); }
  .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-right: 40px; }
  .report-title { font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 22px; }
  .report-title span { color: var(--accent); }
  .report-sub { color: var(--muted); font-size: 11px; letter-spacing: .1em; }
  .score-num { font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 44px; line-height: 1; text-align: center; }
  .score-den { font-size: 10px; color: var(--muted); letter-spacing: .1em; text-align: center; }
  .summary { background: var(--surface); border-radius: 6px; padding: 10px 14px; font-size: 14px; line-height: 1.6; border-left: 2px solid var(--accent); }
  .section-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; border-left: 3px solid; }
  .section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .section-title { font-size: 12px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
  .section-item { padding: 8px 12px; margin-bottom: 6px; background: var(--surface); border-radius: 6px; font-size: 14px; line-height: 1.5; }
  .mission-card { border: 1px solid #00d4ff44; border-radius: 12px; padding: 18px; margin-bottom: 12px; background: linear-gradient(135deg, #1a3a6a44, var(--card)); }
  .mission-label { font-size: 11px; color: var(--accent); letter-spacing: .15em; margin-bottom: 8px; text-transform: uppercase; }
  .mission-text { font-size: 15px; font-weight: 600; line-height: 1.5; }
  .mental-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 12px; }
  .mental-label { color: var(--muted); font-size: 11px; letter-spacing: .2em; margin-bottom: 6px; }
  .mental-text { color: var(--accent); font-size: 16px; font-weight: 600; font-style: italic; }
  .treino-card { border: 1px solid #f0b43044; border-radius: 12px; padding: 18px; margin-bottom: 12px; background: linear-gradient(135deg, #2a1a0044, var(--card)); }
  .treino-title { font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 14px; letter-spacing: .15em; color: var(--gold); text-transform: uppercase; }
  .treino-sub { color: var(--muted); font-size: 12px; margin: 2px 0 14px; }
  .treino-item { display: flex; gap: 12px; padding: 10px 14px; margin-bottom: 8px; background: var(--surface); border-radius: 8px; border-left: 3px solid var(--gold); }
  .treino-num { font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 18px; color: var(--gold); min-width: 24px; }
  .treino-nome { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .treino-desc { font-size: 13px; color: var(--muted); line-height: 1.4; }
  .treino-duracao { font-size: 11px; color: var(--gold); margin-top: 4px; font-family: monospace; }
  .loading-card { text-align: center; padding: 30px; }
  .loading-text { color: var(--accent); font-size: 14px; letter-spacing: .15em; margin-bottom: 8px; }
  .loading-sub { color: var(--muted); font-size: 12px; }
  .loading-bar { margin-top: 18px; height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
  .loading-fill { height: 100%; width: 40%; background: var(--accent); border-radius: 1px; animation: slide 1.4s infinite; }
  @keyframes slide { 0% { transform: translateX(-150%) } 100% { transform: translateX(300%) } }
  .empty { text-align: center; padding: 70px 0; }
  .empty-title { font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 20px; color: var(--muted); letter-spacing: .1em; }
  .empty-sub { color: var(--muted); font-size: 13px; margin-top: 6px; }

  @media (max-width: 960px) { .hero, .grid2 { grid-template-columns: 1fr; } .grid3 { grid-template-columns: 1fr; } .tiles { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; bottom: 0; left: 0; right: 0; top: auto; height: 64px; flex-direction: row; justify-content: space-around; align-items: center; padding: 6px; border-right: none; border-top: 1px solid var(--border); z-index: 200; gap: 2px; }
    .brand, .side-foot { display: none; }
    .nav-item { flex-direction: column; gap: 2px; padding: 6px 4px; font-size: 9px; letter-spacing: .04em; flex: 1; text-align: center; }
    .nav-item .ic { font-size: 17px; }
    main { padding: 16px 14px 90px; }
    .hl { grid-template-columns: 1fr; }
    .train-row { grid-template-columns: 1fr; gap: 2px; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="side" id="side">
    <div class="brand">
      <div class="brand-name">FOX <span>COACH</span></div>
      <div class="brand-sub">SAFEZONE ESPORTS</div>
    </div>
    <div class="nav-item active" data-view="dashboard" onclick="setView('dashboard')"><span class="ic">▦</span>Dashboard</div>
    <div class="nav-item" data-view="partidas" onclick="setView('partidas')"><span class="ic">☰</span>Partidas</div>
    <div class="nav-item" data-view="evolucao" onclick="setView('evolucao')"><span class="ic">↗</span>Evolução</div>
    <div class="nav-item" data-view="mapas" onclick="setView('mapas')"><span class="ic">◎</span>Mapas</div>
    <div class="nav-item" data-view="agentes" onclick="setView('agentes')"><span class="ic">♟</span>Agentes</div>
    <div class="nav-item" data-view="treino" onclick="setView('treino')"><span class="ic">⚑</span>Treino</div>
    <div class="side-foot">
      <div class="live"><div class="dot"></div><span>SISTEMA ATIVO</span></div>
      <button onclick="clearData()">APAGAR DADOS LOCAIS</button>
    </div>
  </nav>

  <main>
    <div class="topbar">
      <input type="text" id="riotId" placeholder="NomeJogador#BR1" autocomplete="off">
      <select id="region">
        <option value="br">BR</option><option value="na">NA</option><option value="eu">EU</option>
        <option value="ap">AP</option><option value="latam">LATAM</option>
      </select>
      <button class="btn" id="btnAnalyze" onclick="fetchMatches()">ANALISAR</button>
      <div class="error-box hidden" id="errorBox"></div>
      <div class="warn-box hidden" id="warnBox"></div>

    <div id="view"></div>
  </main>
</div>

<div id="drawer" class="drawer hidden">
  <div class="drawer-bg" onclick="closeReport()"></div>
  <div class="drawer-panel">
    <button class="drawer-close" onclick="closeReport()">✕</button>
    <div id="drawerBody"></div>
  </div>
</div>

<script>
/* =====================================================================
   FOX COACH — estrutura
   1. CONFIG        chaves, endpoints, fórmula do Fox Score (ajuste aqui)
   2. API           Henrik (via proxy /henrik) + IA (/.netlify/functions/coach)
   3. STORE         localStorage (histórico, metas, diagnósticos)
   4. METRICS       parse de partidas, Fox Score, agregações, tendências
   5. INSIGHTS      FOX AI local (regras) + IA
   6. TRAINING      FOX TRAINING
   7. CHARTS        gráficos SVG sem dependências
   8. VIEWS         Dashboard / Partidas / Evolução / Mapas / Agentes / Treino
   9. REPORT        FOX REPORT detalhado
   Futuro: VOD_ANALYSIS e IA avançada entram como novos módulos que
   escrevem em match.vod / player.vodInsights e são lidos pelas views.
   ===================================================================== */

/* ---------- 1. CONFIG ---------- */
const API_KEY = "HDEV-4c39f4dc-9cef-4a57-bfdd-dd541a5577c0";
const BASE = "https://api.henrikdev.xyz";
const COACH_ENDPOINT = "/.netlify/functions/coach";

const SUBKEYS = ["aim","duels","decision","positioning","teamplay","impact","consistency"];
const SUBPT = { aim:"Mira", duels:"Duelos", decision:"Tomada de decisão", positioning:"Posicionamento", teamplay:"Jogo em equipe", impact:"Impacto", consistency:"Consistência" };
const SUBLABEL = { aim:"Aim", duels:"Duels", decision:"Decision Making", positioning:"Positioning", teamplay:"Teamplay", impact:"Impact", consistency:"Consistency" };

/* Fórmula do Fox Score. Cada faixa [min,max] mapeia o valor para 0–100
   (se min > max a escala é invertida: menor = melhor). */
const FOX = {
  weights: { aim:.15, duels:.20, decision:.15, positioning:.10, teamplay:.10, impact:.20, consistency:.10 },
  resultBonus: 4,                 // +/- pontos por vitória/derrota
  ranges: {
    hs:       [5, 30],            // HS%
    adr:      [70, 170],          // dano médio por round
    kd:       [0.5, 1.8],
    fdiff:    [-0.15, 0.15],      // (first kills - first deaths) por round
    dpr:      [1.0, 0.45],        // mortes por round (invertido)
    fdRate:   [0.25, 0.08],       // first deaths por round (invertido)
    dmgRatio: [0.7, 1.6],         // dano causado / dano recebido
    apr:      [0.05, 0.35],       // assists por round
    acs:      [120, 300],
    kpr:      [0.4, 1.1],
    consistencyK: 160             // sensibilidade ao desvio do ACS em relação à sua média
  },
  /* peso interno de cada componente dentro de cada subnota */
  mix: {
    aim:         { hs:.6, adr:.4 },
    duels:       { kd:.7, fdiff:.3 },
    decision:    { dpr:.6, fdRate:.4 },
    positioning: { dmgRatio:.6, dpr:.4 },
    teamplay:    { apr:.75, result:.25 },
    impact:      { acs:.7, kpr:.3 }
  }
};

/* ---------- helpers ---------- */
const subName = k => `${SUBLABEL[k]} · ${SUBPT[k]}`;
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const fmt = (v,d=0) => (v==null || isNaN(v)) ? "—" : Number(v).toFixed(d);
const scale = (v, [lo,hi]) => clamp((v-lo)/(hi-lo), 0, 1) * 100;
const scoreColor = v => v >= 70 ? "#00e5a0" : v >= 50 ? "#f0b430" : "#ff4655";
const dateLbl = m => new Date(m.start).toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit"});

/* ---------- 2. API ---------- */
async function apiFetch(url) {
  const sep = url.includes("?") ? "&" : "?";
  const urlWithKey = url + sep + "api_key=" + API_KEY;
  const proxyUrl = urlWithKey.replace("https://api.henrikdev.xyz", "/henrik");
  const viaFile = location.protocol === "file:";
  /* 1) proxy (Netlify). Em file:// ele não existe, então pula direto para a chamada direta. */
  if (!viaFile) {
    try {
      const res = await fetch(proxyUrl);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    } catch (err) { console.warn("Proxy falhou, tentando direto:", err.message); }
  }
  /* 2) chamada direta à API da Henrik (funciona ao abrir o HTML localmente) */
  try {
    const res = await fetch(urlWithKey);
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } catch (err) {
    throw new Error("Falha ao acessar a API: " + err.message + (viaFile ? " (aberto como arquivo local — a API precisa permitir CORS)" : ""));
  }
}

async function callCoach(prompt) {
  if (location.protocol === "file:") throw new Error("A análise por IA precisa do deploy do Netlify (função /coach). Estatísticas, Fox Score, gráficos e insights locais funcionam normalmente aqui.");
  const res = await fetch(COACH_ENDPOINT, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ prompt })
  });
  const data = await res.json();
  if (data.error) throw new Error(typeof data.error === "string" ? data.error : JSON.stringify(data.error));
  return data.content?.[0]?.text || "";
}

function parseJSON(text) {
  const cleaned = text.replace(/```json|```/g, "").trim();
  try { return JSON.parse(cleaned); } catch (e) {
    const m = cleaned.match(/\{[\s\S]*\}/);
    if (m) return JSON.parse(m[0]);
    throw e;
  }
}

/* ---------- 3. STORE ---------- */
const Store = {
  KEY: "fox_coach_v2",
  data: { last: null, players: {} },
  load() { try { this.data = JSON.parse(localStorage.getItem(this.KEY)) || this.data; } catch (e) {} if (!this.data.players) this.data.players = {}; },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { console.warn("localStorage:", e); } },
  player(puuid) {
    if (!this.data.players[puuid]) this.data.players[puuid] = { puuid, matches:{}, goals:[], diagnoses:[], insightsAI:null };
    return this.data.players[puuid];
  },
  wipe() { try { localStorage.removeItem(this.KEY); } catch (e) {} this.data = { last:null, players:{} }; }
};

/* ---------- STATE ---------- */
const state = { p: null, view: "dashboard", win: 10, trainCache: [], busy: false };

/* ---------- 4. METRICS ---------- */
function parseMatch(m, puuid) {
  const me = m.players?.all_players?.find(p => p.puuid === puuid);
  if (!me) return null;
  const meta = m.metadata || {};
  if (/deathmatch/i.test(meta.mode || "")) return null;
  const rounds = meta.rounds_played || m.rounds?.length || 0;
  if (!rounds) return null;
  const st = me.stats || {};
  const won = !!m.teams?.[(me.team || "").toLowerCase()]?.has_won;
  const hsN = st.headshots || 0, bsN = st.bodyshots || 0, lsN = st.legshots || 0;
  const shots = hsN + bsN + lsN;

  /* first kills / first deaths — só se a API devolver a lista de kills */
  let fk = null, fd = null;
  if (Array.isArray(m.kills) && m.kills.length) {
    const first = {};
    m.kills.forEach(k => {
      const t = k.kill_time_in_round ?? 0;
      if (!first[k.round] || t < first[k.round].t) first[k.round] = { t, killer: k.killer_puuid, victim: k.victim_puuid };
    });
    fk = 0; fd = 0;
    Object.values(first).forEach(f => { if (f.killer === puuid) fk++; if (f.victim === puuid) fd++; });
  }
  const ac = me.ability_casts;
  const casts = ac && typeof ac === "object" ? Object.values(ac).reduce((s,v)=> s + (typeof v === "number" ? v : 0), 0) : null;
  const hasDmg = typeof me.damage_made === "number";
  const start = meta.game_start ? meta.game_start * 1000 : Date.now();

  return {
    id: meta.matchid || (start + "_" + meta.map),
    start, map: meta.map || "—", mode: meta.mode || "—", agent: me.character || "—",
    won, rounds, k: st.kills || 0, d: st.deaths || 0, a: st.assists || 0,
    score: st.score || 0, acs: (st.score || 0) / rounds,
    hsN, bsN, lsN, hsPct: shots ? hsN / shots * 100 : 0,
    dmg: hasDmg ? me.damage_made : null,
    dmgRecv: typeof me.damage_received === "number" ? me.damage_received : null,
    adr: hasDmg ? me.damage_made / rounds : null,
    kd: (st.kills || 0) / Math.max(1, st.deaths || 0),
    fk, fd, casts, tier: me.currenttier_patched || null,
    report: null, fs: null
  };
}

function scoreMatch(m, meanAcs, n) {
  const R = FOX.ranges, X = FOX.mix, r = m.rounds;
  const dpr = m.d / r, kpr = m.k / r, apr = m.a / r;
  const ratio = (m.dmg != null && m.dmgRecv != null) ? m.dmg / Math.max(1, m.dmgRecv) : null;
  const blend = (parts) => {           // parts: [[valor|null, peso], ...] — ignora o que não existe
    const ok = parts.filter(p => p[0] != null);
    const w = ok.reduce((s,p)=>s+p[1],0);
    return ok.reduce((s,p)=>s+p[0]*p[1],0) / (w || 1);
  };
  const s = {};
  s.aim = blend([[scale(m.hsPct, R.hs), X.aim.hs], [m.adr != null ? scale(m.adr, R.adr) : null, X.aim.adr]]);
  s.duels = blend([[scale(m.kd, R.kd), X.duels.kd], [m.fk != null ? scale((m.fk - m.fd) / r, R.fdiff) : null, X.duels.fdiff]]);
  s.decision = blend([[scale(dpr, R.dpr), X.decision.dpr], [m.fd != null ? scale(m.fd / r, R.fdRate) : null, X.decision.fdRate]]);
  s.positioning = blend([[ratio != null ? scale(ratio, R.dmgRatio) : null, X.positioning.dmgRatio], [scale(dpr, R.dpr), X.positioning.dpr]]);
  s.teamplay = blend([[scale(apr, R.apr), X.teamplay.apr], [m.won ? 100 : 30, X.teamplay.result]]);
  s.impact = blend([[scale(m.acs, R.acs), X.impact.acs], [scale(kpr, R.kpr), X.impact.kpr]]);
  const dev = meanAcs ? Math.abs(m.acs - meanAcs) / meanAcs : 0;
  s.consistency = n >= 3 ? clamp(100 - dev * R.consistencyK, 0, 100) : 50;
  let overall = SUBKEYS.reduce((t,k) => t + s[k] * FOX.weights[k], 0);
  overall += m.won ? FOX.resultBonus : -FOX.resultBonus;
  s.overall = clamp(overall, 0, 100);
  return s;
}

function allMatches(p) { return Object.values(p.matches).sort((a,b) => b.start - a.start); }

function ensureScores(p) {
  const list = allMatches(p);
  const mean = avg(list.map(m => m.acs));
  list.forEach(m => { m.fs = scoreMatch(m, mean, list.length); });
}

function aggregate(list) {
  const n = list.length;
  if (!n) return null;
  const sum = k => list.reduce((s,m) => s + (m[k] || 0), 0);
  const wins = list.filter(m => m.won).length;
  const shots = sum("hsN") + sum("bsN") + sum("lsN");
  const rounds = sum("rounds");
  const withDmg = list.filter(m => m.dmg != null);
  const withBoth = list.filter(m => m.dmg != null && m.dmgRecv != null);
  const withFK = list.filter(m => m.fk != null);
  const subs = {};
  SUBKEYS.forEach(k => subs[k] = avg(list.map(m => m.fs[k])));
  const fdSum = withFK.reduce((s,m)=>s+m.fd,0), fkSum = withFK.reduce((s,m)=>s+m.fk,0), fkRounds = withFK.reduce((s,m)=>s+m.rounds,0);
  return {
    n, wins, losses: n - wins, wr: wins / n * 100,
    kd: sum("k") / Math.max(1, sum("d")),
    acs: avg(list.map(m => m.acs)),
    hsPct: shots ? sum("hsN") / shots * 100 : 0,
    adr: withDmg.length ? withDmg.reduce((s,m)=>s+m.dmg,0) / withDmg.reduce((s,m)=>s+m.rounds,0) : null,
    ratio: withBoth.length ? withBoth.reduce((s,m)=>s+m.dmg,0) / Math.max(1, withBoth.reduce((s,m)=>s+m.dmgRecv,0)) : null,
    dpr: sum("d") / rounds, apr: sum("a") / rounds,
    fdRate: fkRounds ? fdSum / fkRounds : null, fkRate: fkRounds ? fkSum / fkRounds : null,
    fox: avg(list.map(m => m.fs.overall)), subs
  };
}

function trendOf(vals, thr) {           // vals em ordem cronológica
  if (vals.length < 4) return { dir: "na", delta: 0 };
  const h = Math.floor(vals.length / 2);
  const d = avg(vals.slice(vals.length - h)) - avg(vals.slice(0, h));
  return { dir: d >= thr ? "up" : d <= -thr ? "down" : "flat", delta: d };
}
function trendBadge(t, suffix="") {
  const map = { up:["📈","EVOLUINDO"], flat:["➡️","ESTÁVEL"], down:["📉","PIORANDO"], na:["•","DADOS INSUFICIENTES"] };
  const [ic, tx] = map[t.dir];
  const d = t.dir === "na" ? "" : ` (${t.delta > 0 ? "+" : ""}${t.delta.toFixed(1)}${suffix})`;
  return `<span class="trend ${t.dir}">${ic} ${tx}${d}</span>`;
}

const CHART_METRICS = [
  { k:"fox",         label:"Fox Score",       get:m=>m.fs.overall,         thr:3,   dec:0, color:"#00d4ff" },
  { k:"kd",          label:"K/D",             get:m=>m.kd,                 thr:.1,  dec:2, color:"#2f7bff" },
  { k:"acs",         label:"ACS",             get:m=>m.acs,                thr:10,  dec:0, color:"#00e5a0" },
  { k:"hs",          label:"HS%",             get:m=>m.hsPct,              thr:2,   dec:1, color:"#f0b430", suffix:"%" },
  { k:"wr",          label:"Win Rate",        get:m=>m.won?100:0,          thr:15,  dec:0, color:"#00d4ff", cumulative:true, suffix:"%" },
  { k:"aim",         label:"Aim",             get:m=>m.fs.aim,             thr:4,   dec:0, color:"#ff7a45" },
  { k:"decision",    label:"Decision Making", get:m=>m.fs.decision,        thr:4,   dec:0, color:"#b57bff" },
  { k:"positioning", label:"Positioning",     get:m=>m.fs.positioning,     thr:4,   dec:0, color:"#2fd0ff" }
];

function windowList(n) { return allMatches(state.p).slice(0, n); }

/* ---------- 7. CHARTS ---------- */
let chartId = 0;
function lineChart(vals, labels, o = {}) {
  if (vals.length < 2) return `<div class="muted pad" style="font-size:13px">Dados insuficientes (mínimo 2 partidas).</div>`;
  const color = o.color || "#00d4ff", dec = o.dec ?? 0, suf = o.suffix || "";
  const W = 640, H = 210, P = { l: 40, r: 14, t: 14, b: 26 };
  let lo = o.min ?? Math.min(...vals), hi = o.max ?? Math.max(...vals);
  if (lo === hi) { lo -= 1; hi += 1; }
  if (o.min == null) lo -= (hi - lo) * .12;
  if (o.max == null) hi += (hi - lo) * .12;
  const n = vals.length, id = "g" + (++chartId);
  const x = i => P.l + i * (W - P.l - P.r) / (n - 1);
  const y = v => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
  const pts = vals.map((v,i) => [x(i), y(v)]);
  const line = pts.map((p,i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L${x(n-1).toFixed(1)} ${H-P.b} L${x(0).toFixed(1)} ${H-P.b} Z`;
  let grid = "";
  for (let i = 0; i < 4; i++) {
    const v = lo + (hi - lo) * i / 3, yy = y(v);
    grid += `<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="#1a2540" stroke-width="1"/><text x="${P.l-6}" y="${yy+4}" fill="#6a7a9a" font-size="10" text-anchor="end">${v.toFixed(dec)}</text>`;
  }
  const step = Math.ceil(n / 8);
  let xl = "";
  labels.forEach((l,i) => { if (i % step === 0 || i === n - 1) xl += `<text x="${x(i)}" y="${H-8}" fill="#6a7a9a" font-size="10" text-anchor="middle">${esc(l)}</text>`; });
  const dots = pts.map((p,i) => `<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#050810" stroke="${color}" stroke-width="2"><title>${esc(labels[i])}: ${vals[i].toFixed(dec)}${suf}</title></circle>`).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}${xl}<path d="${area}" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" style="filter:drop-shadow(0 0 5px ${color}88)"/>${dots}</svg></div>`;
}

function chartSeries(metric, n) {
  const chron = windowList(n).slice().reverse();
  let vals = chron.map(metric.get);
  const trendVals = vals.slice();
  if (metric.cumulative) { let w = 0; vals = chron.map((m,i) => { w += m.won ? 1 : 0; return w / (i + 1) * 100; }); }
  return { chron, vals, trendVals, labels: chron.map(dateLbl) };
}

/* ---------- UI helpers ---------- */
function statBar(label, val, pct, color) {
  return `<div class="stat-wrap"><div class="stat-label"><span>${label}</span><span>${val}</span></div><div class="stat-track"><div class="stat-fill" style="width:${clamp(pct,0,100)}%;background:${color};box-shadow:0 0 8px ${color}"></div></div></div>`;
}
function ring(val, size=140) {
  const r = size/2 - 10, c = 2 * Math.PI * r, col = scoreColor(val);
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#1a2540" stroke-width="8"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - val/100)}" style="filter:drop-shadow(0 0 6px ${col}88);transition:stroke-dashoffset 1s ease"/></svg>
    <div class="ring-num"><b style="color:${col};text-shadow:0 0 16px ${col}66">${Math.round(val)}</b><small>FOX SCORE</small></div></div>`;
}
function winSeg() {
  return `<div class="seg">${[5,10,20].map(n => `<button class="${state.win===n?"on":""}" onclick="setWin(${n})">${n}</button>`).join("")}</div>`;
}
function emptyView() {
  return `<div class="empty"><div class="empty-title">FOX AGUARDANDO</div><div class="empty-sub">Digite seu Riot ID e clique em ANALISAR para começar o acompanhamento.</div></div>`;
}
const SUBNOTE = `Decision Making, Positioning e Teamplay são <b>estimativas</b> a partir de mortes, trocas de dano e assists — a API não expõe posicionamento real nem comunicação. First kills/deaths só entram quando a API devolve a lista de kills.`;

/* ---------- 5. INSIGHTS (FOX AI) ---------- */
function groupBy(list, key) {
  const g = {};
  list.forEach(m => { (g[m[key]] = g[m[key]] || []).push(m); });
  return Object.entries(g).map(([name, ms]) => ({ name, ...aggregate(ms) }));
}
function bestWorst(groups) {
  if (groups.length < 2) return { best: groups[0] || null, worst: null };
  let pool = groups.filter(g => g.n >= 2);
  if (pool.length < 2) pool = groups;
  const s = pool.slice().sort((a,b) => b.fox - a.fox);
  return { best: s[0], worst: s[s.length - 1], lowSample: pool.every(g => g.n < 2) };
}

function localInsights(all) {
  const out = [], a = aggregate(all);
  if (!a) return out;
  if (all.length < 5) out.push({ t:"na", i:"ℹ️", x:`Apenas ${all.length} partida(s) no histórico — os padrões ficam confiáveis a partir de ~10 partidas.` });

  const ss = SUBKEYS.filter(k => k !== "consistency" || all.length >= 5).sort((x,y) => a.subs[x] - a.subs[y]);
  const weak = ss[0], strong = ss[ss.length - 1];
  if (weak === "aim") out.push({ t:"warn", i:"🎯", x:`Seu maior ponto de melhoria hoje é a mira (Aim ${fmt(a.subs.aim)}), enquanto seu ponto mais forte é ${subName(strong)} (${fmt(a.subs[strong])}).` });
  else out.push({ t:"warn", i:"🧠", x:`Seu maior problema atualmente ${a.subs.aim >= a.subs[weak] + 8 ? "não é mira (" + fmt(a.subs.aim) + ")" : "está em"}${a.subs.aim >= a.subs[weak] + 8 ? ", mas " : " "}${subName(weak)} (${fmt(a.subs[weak])}). Ponto mais forte: ${subName(strong)} (${fmt(a.subs[strong])}).` });

  const chron = all.slice().reverse();
  const tr = trendOf(chron.map(m => m.fs.overall), 3);
  if (tr.dir === "up") out.push({ t:"good", i:"📈", x:`Fox Score em alta: +${tr.delta.toFixed(1)} pontos comparando a metade mais recente com a mais antiga do histórico.` });
  if (tr.dir === "down") out.push({ t:"warn", i:"📉", x:`Fox Score em queda: ${tr.delta.toFixed(1)} pontos comparando a metade mais recente com a mais antiga do histórico.` });

  /* queda após 2 derrotas seguidas */
  const after = [], rest = [];
  chron.forEach((m, i) => { if (i >= 2) ((!chron[i-1].won && !chron[i-2].won) ? after : rest).push(m.fs.overall); });
  if (after.length >= 3 && rest.length >= 3) {
    const d = avg(after) - avg(rest);
    if (d <= -5) out.push({ t:"warn", i:"🔻", x:`Você apresenta queda de performance depois de duas derrotas consecutivas: Fox Score médio ${fmt(avg(after))} contra ${fmt(avg(rest))} nas demais (${after.length} partidas na amostra).` });
    else if (d >= 5) out.push({ t:"good", i:"🧊", x:`Você reage bem a sequências ruins: Fox Score ${fmt(avg(after))} depois de 2 derrotas seguidas, contra ${fmt(avg(rest))} no resto.` });
    else out.push({ t:"info", i:"🧊", x:`Sem queda relevante depois de duas derrotas seguidas (${fmt(avg(after))} vs ${fmt(avg(rest))}).` });
  } else out.push({ t:"na", i:"⏳", x:"Efeito de derrotas consecutivas: amostra insuficiente para avaliar (precisa de pelo menos 3 casos)." });

  /* utilidade — proxy via ability_casts */
  const wc = all.filter(m => m.casts != null);
  if (wc.length >= 8) {
    const cpr = wc.map(m => m.casts / m.rounds).sort((x,y) => x - y), med = cpr[Math.floor(cpr.length / 2)];
    const hi = wc.filter(m => m.casts / m.rounds >= med), lo = wc.filter(m => m.casts / m.rounds < med);
    if (hi.length >= 3 && lo.length >= 3) {
      const d = avg(hi.map(m => m.fs.overall)) - avg(lo.map(m => m.fs.overall));
      if (Math.abs(d) >= 4) out.push({ t: d > 0 ? "good" : "info", i:"✨", x: d > 0 ? `Seu Fox Score é ${d.toFixed(1)} pontos maior quando você usa mais habilidades por round (proxy de uso de utilidade).` : `Seu Fox Score é ${Math.abs(d).toFixed(1)} pontos menor quando você usa mais habilidades por round — vale revisar se o uso está gerando valor.` });
    }
  }

  /* vitórias vs derrotas */
  const w = all.filter(m => m.won), l = all.filter(m => !m.won);
  if (w.length >= 3 && l.length >= 3) out.push({ t:"info", i:"⚖️", x:`ACS médio de ${fmt(avg(w.map(m=>m.acs)))} nas vitórias e ${fmt(avg(l.map(m=>m.acs)))} nas derrotas; K/D ${fmt(aggregate(w).kd,2)} vs ${fmt(aggregate(l).kd,2)}.` });

  if (a.hsPct < 15) out.push({ t:"warn", i:"🎯", x:`HS% de ${fmt(a.hsPct,1)}% está baixo — priorize altura de mira antes de peekar.` });
  else if (a.hsPct >= 25) out.push({ t:"good", i:"🎯", x:`HS% de ${fmt(a.hsPct,1)}% é um ponto forte consistente.` });

  if (a.fdRate != null) out.push({ t: a.fdRate > .16 ? "warn" : "info", i:"⚡", x:`First deaths em ${fmt(a.fdRate*100,1)}% dos rounds e first kills em ${fmt(a.fkRate*100,1)}%.` });
  else out.push({ t:"na", i:"⚡", x:"First kills/deaths: a API não retornou a lista de kills nas suas partidas — não é possível avaliar." });

  const mp = bestWorst(groupBy(all, "map"));
  if (mp.best && mp.worst) out.push({ t:"info", i:"🗺️", x:`Melhor mapa: ${mp.best.name} (Fox ${fmt(mp.best.fox)}). Pior mapa: ${mp.worst.name} (Fox ${fmt(mp.worst.fox)}).` });
  const ag = bestWorst(groupBy(all, "agent"));
  if (ag.best && ag.worst) out.push({ t:"info", i:"♟", x:`Melhor agente: ${ag.best.name} (Fox ${fmt(ag.best.fox)}). Pior: ${ag.worst.name} (Fox ${fmt(ag.worst.fox)}).` });

  out.push({ t:"na", i:"🚫", x:"Lado atacante vs defensor: a API não informa o lado por jogador/round — não é possível avaliar esse recorte." });
  return out;
}

async function genAI() {
  const all = allMatches(state.p), a = aggregate(all);
  const btn = $("#btnAI"); if (btn) { btn.disabled = true; btn.textContent = "ANALISANDO..."; }
  const byMap = groupBy(all, "map").map(g => ({ mapa:g.name, partidas:g.n, winrate:+g.wr.toFixed(0), kd:+g.kd.toFixed(2), acs:+g.acs.toFixed(0), fox:+g.fox.toFixed(0) }));
  const byAgent = groupBy(all, "agent").map(g => ({ agente:g.name, partidas:g.n, winrate:+g.wr.toFixed(0), kd:+g.kd.toFixed(2), acs:+g.acs.toFixed(0), fox:+g.fox.toFixed(0) }));
  const summary = {
    partidas: a.n, winrate: +a.wr.toFixed(1), kd: +a.kd.toFixed(2), acs: +a.acs.toFixed(0), hs_pct: +a.hsPct.toFixed(1),
    dano_por_round: a.adr != null ? +a.adr.toFixed(0) : null, razao_dano_causado_recebido: a.ratio != null ? +a.ratio.toFixed(2) : null,
    first_deaths_por_round_pct: a.fdRate != null ? +(a.fdRate * 100).toFixed(1) : null,
    fox_score: +a.fox.toFixed(0), subnotas: Object.fromEntries(SUBKEYS.map(k => [k, +a.subs[k].toFixed(0)])),
    mapas: byMap, agentes: byAgent,
    ultimas_partidas_cronologicas: all.slice(0, 20).reverse().map(m => ({ r: m.won ? "V" : "D", mapa: m.map, agente: m.agent, kda: `${m.k}/${m.d}/${m.a}`, acs: +m.acs.toFixed(0), hs: +m.hsPct.toFixed(0), fox: +m.fs.overall.toFixed(0) }))
  };
  const prompt = `Você é o Fox Coach, analista de Valorant da SafeZone Esports. Analise o histórico agregado abaixo e identifique PADRÕES. Use SOMENTE os dados fornecidos; não invente métricas. Se algo não puder ser avaliado com esses dados (ex.: lado atacante/defensor, posicionamento real, comunicação), liste em dados_indisponiveis. Responda em português do Brasil e retorne APENAS JSON válido, sem markdown:
{"diagnostico_principal":"<1 frase direta sobre o maior problema atual>","insights":[{"titulo":"<curto>","texto":"<1-2 frases baseadas nos números>","tipo":"alerta|positivo|padrao"}],"dados_indisponiveis":["<item>"]}
Gere de 4 a 6 insights.
DADOS: ${JSON.stringify(summary)}`;
  try {
    const data = parseJSON(await callCoach(prompt));
    state.p.insightsAI = { t: Date.now(), n: all.length, data };
    state.p.diagnoses.push({ t: Date.now(), n: all.length, fox: a.fox, kind: "ai", diag: data.diagnostico_principal || "" });
    state.p.diagnoses = state.p.diagnoses.slice(-60);
    Store.save(); render();
  } catch (e) {
    render();
    const box = $("#aiErr"); if (box) box.innerHTML = `<div class="error-box">Falha ao gerar análise da IA: ${esc(e.message)}</div>`;
  }
}

/* ---------- 6. TRAINING ---------- */
const GOALMETRIC = {
  hsPct:   { label:"HS%",                   get:a=>a.hsPct,                dec:1, unit:"%", dir:"up" },
  kd:      { label:"K/D",                   get:a=>a.kd,                   dec:2, unit:"",  dir:"up" },
  fdRate:  { label:"First deaths (% rounds)", get:a=>a.fdRate!=null?a.fdRate*100:null, dec:1, unit:"%", dir:"down" },
  dpr:     { label:"Mortes por round",      get:a=>a.dpr,                  dec:2, unit:"",  dir:"down" },
  ratio:   { label:"Dano causado/recebido", get:a=>a.ratio,                dec:2, unit:"",  dir:"up" },
  apr:     { label:"Assists por round",     get:a=>a.apr,                  dec:2, unit:"",  dir:"up" },
  acs:     { label:"ACS",                   get:a=>a.acs,                  dec:0, unit:"",  dir:"up" },
  consist: { label:"Consistency (nota)",    get:a=>a.subs.consistency,     dec:0, unit:"",  dir:"up" }
};

const TRAIN = {
  aim: a => ({ problem:"Precisão (HS% e dano por round)", metric:"hsPct", target:Math.min(a.hsPct + 4, 40),
    objective:"Aumentar a taxa de headshot sem perder volume de dano.",
    exercise:"Aquecimento fixo: 15 min de range (bots Hard, só cabeça) + 1 Deathmatch focando a altura da mira ANTES de cada peek. Antes de jogar ranqueada, repita o mesmo aquecimento.",
    duration:"15–20 min/dia durante 7 dias" }),
  duels: a => ({ problem:"Duelos individuais (K/D)", metric:"kd", target:+(a.kd + .1).toFixed(2),
    objective:"Vencer mais duelos 1v1 com disciplina de tiro.",
    exercise:"2 Deathmatches por dia: counter-strafe antes de cada tiro, não correr atirando e trocar de posição após cada kill.",
    duration:"2 partidas de DM/dia por 7 dias" }),
  decision: a => a.fdRate != null
    ? ({ problem:"First Deaths", metric:"fdRate", target:+(a.fdRate * 100 * .8).toFixed(1),
        objective:"Parar de entregar o primeiro contato sem informação ou utilidade.",
        exercise:"3 partidas evitando o primeiro contato sem informação ou utilidade: espere o time abrir espaço, use habilidade antes do peek e jogue o primeiro duelo com troca disponível.",
        duration:"3 partidas ranqueadas/competitivas" })
    : ({ problem:"Tomada de decisão (mortes por round)", metric:"dpr", target:+(a.dpr - .05).toFixed(2),
        objective:"Morrer menos em rounds que poderiam ser jogados com informação.",
        exercise:"Antes de cada engajamento pergunte: tenho informação? tenho troca? tenho saída? Se alguma resposta for não, recue e reposicione. Anote 1 morte evitável por partida.",
        duration:"3 partidas com anotação pós-jogo" }),
  positioning: a => ({ problem:"Posicionamento (troca de dano)", metric:"ratio", target:+((a.ratio ?? 1) + .1).toFixed(2),
    objective:"Dar mais dano do que recebe em cada confronto.",
    exercise:"Em cada round defina o ângulo de saída antes do contato, jogue perto de cover e troque de posição depois de dar informação ou dano.",
    duration:"3 partidas com foco em 1 regra por mapa" }),
  teamplay: a => ({ problem:"Jogo em equipe (assists)", metric:"apr", target:+(a.apr + .03).toFixed(2),
    objective:"Gerar mais valor para o time com utilidade e trocas.",
    exercise:"3 partidas jogando junto: fique a uma habilidade de distância do aliado para trocar e use utilidade para abrir espaço antes de entrar.",
    duration:"3 partidas" }),
  impact: a => ({ problem:"Impacto (ACS)", metric:"acs", target:Math.round(a.acs + 15),
    objective:"Aumentar o dano e as kills com impacto nos rounds decisivos.",
    exercise:"Escolha 1 agente principal por 5 partidas e jogue de forma proativa no início de cada round (iniciar a ação com utilidade).",
    duration:"5 partidas com o mesmo agente" }),
  consistency: a => ({ problem:"Consistência de desempenho", metric:"consist", target:Math.round(a.subs.consistency + 8),
    objective:"Reduzir a variação de performance entre partidas.",
    exercise:"Rotina fixa pré-jogo (10 min de warm-up), pausa obrigatória após 2 derrotas seguidas e revisão de 1 round por partida.",
    duration:"5 partidas seguindo a rotina" })
};

function buildTraining(all) {
  const a = aggregate(all);
  if (!a) return [];
  const order = SUBKEYS.filter(k => k !== "consistency" || all.length >= 5).sort((x,y) => a.subs[x] - a.subs[y]).slice(0, 3);
  return order.map(k => {
    const t = TRAIN[k](a), gm = GOALMETRIC[t.metric];
    return { key:k, ...t, label:gm.label, dec:gm.dec, unit:gm.unit, baseline:gm.get(a), subScore:a.subs[k] };
  });
}

function goalProgress(g) {
  const cur = GOALMETRIC[g.metric].get(aggregate(windowList(5)));
  if (cur == null) return { cur:null, pct:0 };
  const pct = clamp((cur - g.baseline) / ((g.target - g.baseline) || 1), 0, 1) * 100;
  return { cur, pct };
}

function adoptGoal(i) {
  const t = state.trainCache[i]; if (!t) return;
  if (state.p.goals.some(g => g.key === t.key && !g.done)) return;
  state.p.goals.push({ id: "g" + Date.now(), key:t.key, metric:t.metric, problem:t.problem, label:t.label, dec:t.dec, unit:t.unit, baseline:t.baseline, target:+t.target, created:Date.now(), matchesAtStart:Object.keys(state.p.matches).length, done:false });
  Store.save(); render();
}
function removeGoal(id) { state.p.goals = state.p.goals.filter(g => g.id !== id); Store.save(); render(); }

function goalsHTML() {
  const gs = state.p.goals;
  if (!gs.length) return `<div class="muted" style="font-size:13px">Nenhuma meta ativa. Adote uma prioridade abaixo para acompanhar seu progresso.</div>`;
  return gs.map(g => {
    const pr = goalProgress(g), done = pr.pct >= 100;
    return `<div class="goal"><div class="goal-top"><span class="goal-name">${esc(g.problem)} ${done ? "✅" : ""}</span><button class="x" title="Remover" onclick="removeGoal('${g.id}')">✕</button></div>
      <div class="goal-nums">${esc(g.label)}: base ${fmt(g.baseline, g.dec)}${g.unit} → meta ${fmt(g.target, g.dec)}${g.unit} · atual (últimas 5) ${fmt(pr.cur, g.dec)}${g.unit}</div>
      ${statBar("Progresso", Math.round(pr.pct) + "%", pr.pct, done ? "#00e5a0" : "#00d4ff")}</div>`;
  }).join("");
}

function hlCards(bw, nameLabel) {
  if (!bw.best) return "";
  const c = (g, lab, col) => g ? `<div class="card" style="border-color:${col}55"><div class="hl-label" style="color:${col}">${lab}</div><div class="hl-name">${esc(g.name)}</div><div class="hl-sub">Fox ${fmt(g.fox)} · ${fmt(g.wr)}% WR · K/D ${fmt(g.kd,2)} · ACS ${fmt(g.acs)} · ${g.n} partida(s)</div></div>` : "";
  return `<div class="hl">${c(bw.best, "MELHOR " + nameLabel, "#00e5a0")}${bw.worst ? c(bw.worst, "PIOR " + nameLabel, "#ff4655") : ""}</div>${bw.lowSample ? '<div class="warn-box" style="margin-bottom:14px">Amostra pequena (menos de 2 partidas por item) — a comparação ainda não é confiável.</div>' : ""}`;
}

function viewMapas() {
  const g = groupBy(allMatches(state.p), "map"), bw = bestWorst(g);
  return `<div class="page-title">ANÁLISE POR <span>MAPA</span></div><div class="page-sub">Baseado em todo o histórico salvo.</div>${hlCards(bw, "MAPA")}${groupTable(g, "Mapa", bw)}`;
}
function viewAgentes() {
  const g = groupBy(allMatches(state.p), "agent"), bw = bestWorst(g);
  return `<div class="page-title">ANÁLISE POR <span>AGENTE</span></div><div class="page-sub">Baseado em todo o histórico salvo.</div>${hlCards(bw, "AGENTE")}${groupTable(g, "Agente", bw)}`;
}

function viewTreino() {
  const all = allMatches(state.p), tr = buildTraining(all);
  state.trainCache = tr;
  const dg = state.p.diagnoses.slice(-6).reverse();
  return `<div class="page-title">FOX <span>TRAINING</span></div>
  <div class="page-sub">Prioridades geradas a partir das suas piores subnotas. Adote uma meta para acompanhar o progresso (medido nas últimas 5 partidas).</div>
  <div class="card"><div class="card-title"><span>METAS EM ANDAMENTO</span></div>${goalsHTML()}</div>
  ${tr.map((t, i) => {
    const adopted = state.p.goals.some(g => g.key === t.key && !g.done);
    return `<div class="train"><div class="train-p">PRIORIDADE #${i + 1}</div><div class="train-t">${esc(t.problem)}</div>
      <div class="train-row"><b>Objetivo</b><span>${esc(t.objective)}</span></div>
      <div class="train-row"><b>Meta</b><span>${esc(t.label)}: de <b style="color:var(--text)">${fmt(t.baseline, t.dec)}${t.unit}</b> para <b style="color:var(--gold)">${fmt(t.target, t.dec)}${t.unit}</b> <span class="muted">(nota atual ${fmt(t.subScore)}/100)</span></span></div>
      <div class="train-row"><b>Exercício</b><span>${esc(t.exercise)}</span></div>
      <div class="train-row"><b>Duração</b><span>${esc(t.duration)}</span></div>
      <div style="margin-top:12px"><button class="btn ghost sm" ${adopted ? "disabled" : ""} onclick="adoptGoal(${i})">${adopted ? "META ADOTADA" : "ADOTAR META"}</button></div></div>`;
  }).join("")}
  ${insightsPanel(all)}
  ${dg.length ? `<div class="card"><div class="card-title"><span>DIAGNÓSTICOS ANTERIORES</span></div>${dg.map(d => `<div class="ins ${d.kind === "ai" ? "" : "na"}"><span class="ico">${d.kind === "ai" ? "🦊" : "📊"}</span><div><span class="muted">${new Date(d.t).toLocaleString("pt-BR")} · ${d.n} partidas · Fox ${fmt(d.fox)}</span>${d.diag ? "<br>" + esc(d.diag) : (d.weak ? "<br>Ponto mais fraco: " + esc(SUBLABEL[d.weak] ? subName(d.weak) : d.weak) : "")}</div></div>`).join("")}</div>` : ""}`;
}

/* ---------- 9. REPORT ---------- */
function openReport(id) {
  const m = state.p.matches[id]; if (!m) return;
  $("#drawer").classList.remove("hidden");
  document.body.style.overflow = "hidden";
  const col = scoreColor(m.fs.overall);
  $("#drawerBody").innerHTML = `
    <div class="card" style="border-top:3px solid ${col}">
      <div class="report-header"><div><div class="report-title">FOX <span>REPORT</span></div><div class="report-sub">${esc(m.map)} · ${esc(m.agent)} · ${m.won ? "VITÓRIA" : "DERROTA"} · ${new Date(m.start).toLocaleDateString("pt-BR")}</div></div>
        <div><div class="score-num" style="color:${col};text-shadow:0 0 20px ${col}">${Math.round(m.fs.overall)}</div><div class="score-den">FOX SCORE</div></div></div>
      <div class="tiles" style="grid-template-columns:repeat(4,1fr)">
        <div class="tile"><div class="tile-l">K/D/A</div><div class="tile-v" style="font-size:17px">${m.k}/${m.d}/${m.a}</div></div>
        <div class="tile"><div class="tile-l">K/D</div><div class="tile-v" style="font-size:17px">${fmt(m.kd,2)}</div></div>
        <div class="tile"><div class="tile-l">ACS</div><div class="tile-v" style="font-size:17px">${fmt(m.acs)}</div></div>
        <div class="tile"><div class="tile-l">HS%</div><div class="tile-v" style="font-size:17px">${fmt(m.hsPct)}%</div></div>
      </div>
    </div>
    <div class="card"><div class="card-title"><span>SUBNOTAS</span></div>
      ${SUBKEYS.map(k => statBar(subName(k), fmt(m.fs[k]), m.fs[k], scoreColor(m.fs[k]))).join("")}
      ${m.adr != null ? statBar("Dano por round", fmt(m.adr), m.adr / 2, "#2f7bff") : ""}
      <div class="foot-note">${SUBNOTE}</div></div>
    <div id="reportAI"></div>`;
  if (m.report) renderReportAI(m, m.report); else runReportAI(m);
}
function closeReport() { $("#drawer").classList.add("hidden"); document.body.style.overflow = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeReport(); });

async function runReportAI(m) {
  const box = $("#reportAI");
  box.innerHTML = `<div class="card loading-card"><div class="loading-text">FOX ANALISANDO...</div><div class="loading-sub">Processando dados com IA</div><div class="loading-bar"><div class="loading-fill"></div></div></div>`;
  const extra = [
    m.adr != null ? `Dano médio por round: ${Math.round(m.adr)}` : null,
    (m.dmg != null && m.dmgRecv != null) ? `Dano causado/recebido: ${m.dmg}/${m.dmgRecv}` : null,
    m.fk != null ? `First kills: ${m.fk}, First deaths: ${m.fd}` : null
  ].filter(Boolean).join(", ");
  const prompt = `Analise essa partida de Valorant do jogador da SafeZone Esports e retorne APENAS JSON válido:
DADOS: Agente: ${m.agent}, Mapa: ${m.map}, Resultado: ${m.won ? "VITÓRIA" : "DERROTA"}, KDA: ${m.k}/${m.d}/${m.a}, ACS: ${Math.round(m.acs)}, Headshot%: ${Math.round(m.hsPct)}%, K/D: ${m.kd.toFixed(2)}, Rounds: ${m.rounds}${extra ? ", " + extra : ""}
SUBNOTAS FOX (0-100): ${SUBKEYS.map(k => SUBLABEL[k] + " " + Math.round(m.fs[k])).join(", ")}; Fox Score ${Math.round(m.fs.overall)}.
Use apenas os dados acima; não invente métricas (ex.: posicionamento no mapa, uso de utilidade) que não foram informadas.
Retorne EXATAMENTE este JSON sem markdown:
{"nota_geral":<0-10>,"resumo":"<2 frases diretas>","pontos_fortes":["<p1>","<p2>"],"pontos_fracos":["<p1>","<p2>"],"missao_proxima_partida":"<1 missão objetiva>","mentalidade":"<1 frase SafeZone>","treino_individual":{"titulo":"<título do plano de treino baseado nos dados>","exercicios":[{"nome":"<nome do exercício>","descricao":"<o que fazer e como>","duracao":"<ex: 15 min>"},{"nome":"<nome>","descricao":"<descrição>","duracao":"<tempo>"},{"nome":"<nome>","descricao":"<descrição>","duracao":"<tempo>"}]}}`;
  try {
    const a = parseJSON(await callCoach(prompt));
    m.report = a; Store.save();
    if (!$("#drawer").classList.contains("hidden")) renderReportAI(m, a);
  } catch (e) {
    box.innerHTML = `<div class="card" style="color:var(--red);text-align:center">Erro ao processar análise. Tente novamente.<br><small style="color:var(--muted)">${esc(e.message || "")}</small><br><br><button class="btn ghost sm" onclick="regenReport('${esc(m.id)}')">TENTAR NOVAMENTE</button></div>`;
  }
}
function regenReport(id) { const m = state.p.matches[id]; if (m) { m.report = null; runReportAI(m); } }

function renderReportAI(m, a) {
  const color = scoreColor((a.nota_geral || 0) * 10);
  const list = arr => (arr || []).map(p => `<div class="section-item">${esc(p)}</div>`).join("");
  const tr = a.treino_individual;
  $("#reportAI").innerHTML = `
    <div class="card"><div class="report-header" style="padding-right:0"><div class="card-title" style="margin:0"><span>ANÁLISE DA IA</span></div><div style="text-align:right"><b class="exo" style="font-size:24px;color:${color}">${esc(a.nota_geral)}</b><span class="muted"> / 10</span></div></div><div class="summary">${esc(a.resumo)}</div></div>
    <div class="section-card" style="border-left-color:#00e5a0"><div class="section-head"><span>⚡</span><span class="section-title" style="color:#00e5a0">Pontos Fortes</span></div>${list(a.pontos_fortes)}</div>
    <div class="section-card" style="border-left-color:#ff4655"><div class="section-head"><span>🎯</span><span class="section-title" style="color:#ff4655">Pontos a Melhorar</span></div>${list(a.pontos_fracos)}</div>
    <div class="mission-card"><div class="mission-label">🦊 Missão — Próxima Partida</div><div class="mission-text">${esc(a.missao_proxima_partida)}</div></div>
    ${tr && tr.exercicios ? `<div class="treino-card"><div class="treino-title">🏋️ Plano de Treino Individual</div><div class="treino-sub">${esc(tr.titulo || "Baseado no seu desempenho")}</div>
      ${tr.exercicios.map((ex,i) => `<div class="treino-item"><div class="treino-num">${i+1}</div><div><div class="treino-nome">${esc(ex.nome)}</div><div class="treino-desc">${esc(ex.descricao)}</div><div class="treino-duracao">⏱ ${esc(ex.duracao)}</div></div></div>`).join("")}</div>` : ""}
    <div class="mental-card"><div class="mental-label">MENTALIDADE SAFEZONE</div><div class="mental-text">"${esc(a.mentalidade)}"</div></div>
    <div style="text-align:center"><button class="btn ghost sm" onclick="regenReport('${esc(m.id)}')">REGERAR ANÁLISE</button></div>`;
}

/* ---------- FETCH / BOOT ---------- */
function showErr(msg) { const b = $("#errorBox"); b.textContent = msg; b.classList.remove("hidden"); }
function hideErr() { $("#errorBox").classList.add("hidden"); $("#warnBox").classList.add("hidden"); }
function showWarn(msg) { const b = $("#warnBox"); b.textContent = msg; b.classList.remove("hidden"); }

async function fetchMatches() {
  const rid = $("#riotId").value.trim(), region = $("#region").value, btn = $("#btnAnalyze");
  if (!rid.includes("#")) { showErr("Formato inválido. Use: NomeJogador#TAG"); return; }
  hideErr(); btn.disabled = true; btn.textContent = "BUSCANDO...";
  const [name, tag] = [rid.slice(0, rid.lastIndexOf("#")), rid.slice(rid.lastIndexOf("#") + 1)];
  try {
    const acc = await apiFetch(`${BASE}/valorant/v1/account/${encodeURIComponent(name)}/${encodeURIComponent(tag)}`);
    if (acc.status !== 200) { showErr("Jogador não encontrado."); return; }
    const puuid = acc.data.puuid, p = Store.player(puuid);
    Object.assign(p, { name: acc.data.name, tag: acc.data.tag, region, level: acc.data.account_level, card: acc.data.card?.small || p.card || null });

    /* rank / peak / RR — opcional: se falhar, segue sem */
    try {
      const mmr = await apiFetch(`${BASE}/valorant/v2/mmr/${region}/${encodeURIComponent(name)}/${encodeURIComponent(tag)}`);
      if (mmr.status === 200 && mmr.data) p.rank = { current: mmr.data.current_data?.currenttierpatched || null, rr: mmr.data.current_data?.ranking_in_tier ?? null, peak: mmr.data.highest_rank?.patched_tier || null };
    } catch (e) { showWarn("Rank/Peak/RR indisponíveis agora (endpoint MMR falhou). O restante da análise segue normal."); }

    let mr = null;
    try { mr = await apiFetch(`${BASE}/valorant/v3/matches/${region}/${encodeURIComponent(name)}/${encodeURIComponent(tag)}?size=20`); } catch (e) {}
    if (!mr || mr.status !== 200 || !mr.data?.length) mr = await apiFetch(`${BASE}/valorant/v3/matches/${region}/${encodeURIComponent(name)}/${encodeURIComponent(tag)}?size=10`);
    if (mr.status !== 200 || !mr.data?.length) { showErr("Nenhuma partida encontrada."); return; }

    let added = 0;
    mr.data.forEach(raw => {
      const rec = parseMatch(raw, puuid);
      if (!rec) return;
      if (p.matches[rec.id]) { rec.report = p.matches[rec.id].report; }  /* preserva análise já feita */
      else added++;
      p.matches[rec.id] = rec;
    });
    p.region = region; p.riotId = rid; p.updated = Date.now();
    state.p = p; Store.data.last = puuid;
    ensureScores(p);
    const all = allMatches(p), ag = aggregate(all);
    if (added > 0 && ag) {
      const weak = SUBKEYS.slice().sort((x,y) => ag.subs[x] - ag.subs[y])[0];
      p.diagnoses.push({ t: Date.now(), n: all.length, fox: ag.fox, weak, kind: "auto" });
      p.diagnoses = p.diagnoses.slice(-60);
    }
    Store.save();
    if (!added) showWarn("Nenhuma partida nova desde a última análise — histórico mantido.");
    render();
  } catch (e) {
    showErr("Erro: " + (e.message || e));
  } finally {
    btn.disabled = false; btn.textContent = "ANALISAR";
  }
}

function clearData() {
  if (!confirm("Apagar todo o histórico, metas e diagnósticos salvos neste navegador?")) return;
  Store.wipe(); state.p = null; render();
}

(function boot() {
  Store.load();
  const last = Store.data.last && Store.data.players[Store.data.last];
  if (last) {
    state.p = last;
    $("#riotId").value = last.riotId || (last.name ? last.name + "#" + last.tag : "");
    if (last.region) $("#region").value = last.region;
  }
  $("#riotId").addEventListener("keydown", e => { if (e.key === "Enter") fetchMatches(); });
  render();
})();
</script>
